<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Save the Date</title>

    <!-- ================================================
         LINK PREVIEW (Open Graph / Twitter Card)
         This is what makes WhatsApp, iMessage, Instagram,
         etc. show a photo + title automatically when this
         link is pasted or shared, instead of a plain link.
         Edit the content values below to match your details.
    ================================================= -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="You're Invited — Save the Date!">
    <meta property="og:description" content="Tap to open our wedding invitation 💍">
    <meta property="og:image" content="https://cdn.shopify.com/s/files/1/0778/9474/6301/files/wedding.jpg?v=1789533768">
    <meta property="og:url" content="https://amit-and-geeta.onrender.com/">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="You're Invited — Save the Date!">
    <meta name="twitter:description" content="Tap to open our wedding invitation 💍">
    <meta name="twitter:image" content="https://cdn.shopify.com/s/files/1/0778/9474/6301/files/wedding.jpg?v=1789533768">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            scroll-behavior: smooth;

            width: 100%;
            max-width: 100%;

            overflow-x: hidden;
        }

        body {
            width: 100%;
            max-width: 100%;
            min-height: 100vh;
            overflow-x: hidden;

            font-family:
                "Cormorant Garamond",
                serif;

            background: #f3eeea;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        .site {
            width: 100%;
            max-width: 100%;
            min-height: 100vh;
            overflow-x: hidden;

            opacity: 1;
        }

        .site .second-page > * {
            opacity: 0;

            transform: translateY(60px);

            transition:
                opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .site.revealed .second-page > *{
            opacity: 1;

            transform: translateY(0);
        }

        .site .second-page > *:nth-child(1) { transition-delay: 0.05s; }
        .site .second-page > *:nth-child(2) { transition-delay: 0.15s; }
        .site .second-page > *:nth-child(3) { transition-delay: 0.25s; }
        .site .second-page > *:nth-child(4) { transition-delay: 0.35s; }
        .site .second-page > *:nth-child(5) { transition-delay: 0.45s; }
        .site .second-page > *:nth-child(6) { transition-delay: 0.55s; }
        .site .second-page > *:nth-child(7) { transition-delay: 0.65s; }


        /* =========================================
           FIRST OPENING PAGE
        ========================================= */

        .opening-page {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100vh;
            height: 100dvh;

            z-index: 999999;

            background: #E1DBCA;

            cursor: pointer;

            overflow: hidden;

            opacity: 1;

            visibility: visible;

            transform: scale(1);

            transition:
                opacity 1.4s cubic-bezier(0.4, 0, 0.2, 1),
                visibility 1.4s cubic-bezier(0.4, 0, 0.2, 1),
                transform 1.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .opening-page.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .opening-page-video {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: contain;
            object-position: center;
        }

        /* Hand emoji + "Tap to Open" sitting ON the envelope in the
           video. The video is centred and "contain"-fitted, so its
           height is min(screen height, screen width x 16/9); the
           hand sits just below the wax seal (~61% of the video height).
           Hidden once the video starts. */
        .tap-to-open {
            position: absolute;
            left: 50%;
            top: calc(50% + 0.115 * min(100dvh, 177.78vw));

            transform: translate(-50%, -50%);

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;

            pointer-events: none;

            transition: opacity 0.4s ease;
        }

        .tap-hand {
            font-size: 44px;
            line-height: 1;

            filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.25));

            animation: tapHand 1.2s ease-in-out infinite;
        }

        .tap-label {
            color: #ffffff;

            font-family: "Montserrat", sans-serif;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            white-space: nowrap;

            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
        }

        .opening-page.playing .tap-to-open {
            opacity: 0;
        }

        /* Hand "presses" up towards the seal, like a tap. */
        @keyframes tapHand {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(0.92); }
        }

        /* =========================================
           MAIN WEDDING PAGE
        ========================================= */

        .second-page {
            width: 100%;
            max-width: 900px;
            min-height: 100vh;

            margin: 0 auto;

            position: relative;

            background-image:
                url("./bg.jpg.jpeg"),
                url("./bg2.png");

            background-size: cover, cover;
            background-position: center top, center top;
            background-repeat: no-repeat, no-repeat;

            overflow: hidden;
        }


        /* =========================================
           DECORATIVE FLOWERS
        ========================================= */

        .floral-deco {
            position: absolute;

            width: 110px;
            height: auto;

            opacity: 0.95;

            pointer-events: none;
        }

        .floral-deco.deco-tr {
            top: 6px;
            right: 2px;

            transform: rotate(8deg);

            z-index: 2;
        }

        .floral-deco.deco-bl {
            bottom: 4px;
            left: 2px;

            transform:
                scaleX(-1)
                rotate(6deg);

            z-index: 0;

            width: 95px;
        }

        .floral-deco.deco-br {
            bottom: 4px;
            right: 2px;

            transform:
                rotate(190deg);

            z-index: 0;

            width: 100px;
        }


        /* =========================================
           ENVELOPE
        ========================================= */

        .envelope-section {
            width: 100%;

            display: flex;
            justify-content: center;

            padding: 40px 15px 0;

            position: relative;

            z-index: 1;
        }

        .envelope-wrapper {
            width: min(90%, 320px);
        }

        .envelope-card {
            width: 100%;
            height: auto;

            display: block;

            filter:
                drop-shadow(
                    0 15px 25px
                    rgba(0, 0, 0, 0.18)
                );
        }


        /* =========================================
           NOTE
        ========================================= */

        :root {
            --note-overlap: -30px;
            --story-overlap: -60px;
        }

        .note-section {
            width: 100%;

            display: flex;
            justify-content: center;

            padding: 0 15px 30px;

            position: relative;

            z-index: 2;

            margin-top:
                var(--note-overlap);
        }

        .note-wrapper {
            width: min(70%, 400px);
        }

        .note-card {
            width: 100%;
            height: auto;

            display: block;

            filter:
                drop-shadow(
                    0 10px 25px
                    rgba(0, 0, 0, 0.10)
                );
        }


        /* =========================================
           POST CARD
        ========================================= */

        .story-card-section {
            width: 100%;

            display: flex;
            justify-content: center;

            padding: 0 15px 50px;

            position: relative;

            z-index: 3;

            margin-top:
                var(--story-overlap);

            overflow: visible;
        }

        .story-card-wrapper {
            position: relative;

            width: min(88%, 440px);

            margin-top: 30px;

            margin-left: auto;
            margin-right: auto;
        }

        .post-card {
            width: 100%;
            height: auto;

            display: block;

            position: relative;

            z-index: 1;

            transform:
                rotate(-4deg);

            cursor: pointer;

            filter:
                drop-shadow(
                    0 15px 25px
                    rgba(0, 0, 0, 0.18)
                );

            transition:
                transform 0.3s ease;
        }

        .post-card:hover {
            transform:
                rotate(-4deg)
                scale(1.02);
        }


        /* =========================================
           VINYL
        ========================================= */

        .vinyl {
            position: absolute;

            width: 36%;
            height: auto;

            left: 0%;
            top: -14%;

            z-index: 5;

            cursor: pointer;

            filter:
                drop-shadow(
                    0 10px 15px
                    rgba(0, 0, 0, 0.25)
                );

            animation:
                vinylFloat
                4s
                ease-in-out
                infinite;
        }

        .vinyl.is-playing {
            animation:
                vinylSpin
                2.4s
                linear
                infinite;
        }

        @keyframes vinylSpin {

            from {
                transform:
                    rotate(0deg);
            }

            to {
                transform:
                    rotate(360deg);
            }

        }

        @keyframes vinylFloat {

            0% {
                transform:
                    translateY(0)
                    rotate(-4deg);
            }

            50% {
                transform:
                    translateY(-8px)
                    rotate(2deg);
            }

            100% {
                transform:
                    translateY(0)
                    rotate(-4deg);
            }

        }



        /* =========================================
           COUNTDOWN
        ========================================= */

        .countdown-section {
            width: 100%;

            text-align: center;

            padding:
                30px
                20px
                60px;

            position: relative;

            z-index: 1;
        }

        .countdown-heading {
            width: min(100%, 420px);

            height: auto;

            display: inline-block;

            margin-bottom: 30px;
        }

        .countdown {
            display: flex;

            justify-content: center;

            align-items: flex-start;

            gap: 10px;

            flex-wrap: wrap;
        }

        .time-box {
            min-width: 95px;

            text-align: center;
        }

        .time-number {
            font-family:
                "Times New Roman",
                Times,
                serif;

            font-weight: 600;

            font-size: 62px;

            color: #c69973;

            letter-spacing: 1px;

            font-variant-numeric: lining-nums;

            font-feature-settings: "lnum" 1, "tnum" 1;
        }

        .time-label {
            margin-top: 18px;

            font-family:
                "Times New Roman",
                Times,
                serif;

            font-weight: 600;

            font-size: 16px;

            letter-spacing: 2px;

            color: #2c2a28;

            white-space: nowrap;
        }

        .separator {
            font-family:
                "Times New Roman",
                Times,
                serif;

            font-size: 48px;

            font-weight: 600;

            color: #c69973;
        }


        /* =========================================
           LEAF DECORATION (bottom-left corner)
        ========================================= */

        .leaf-deco {
            position: absolute;

            bottom: -10px;
            left: -10px;

            width: 150px;
            height: auto;

            z-index: 4;

            pointer-events: none;

            opacity: 0.95;
        }


        /* =========================================
           WEDDING IMAGE
        ========================================= */

        .wedding-section {
            position: relative;

            width: 100%;

            height: 400px;

            overflow: hidden;
        }

        .wedding-image {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            object-position: center;
        }


        /* =========================================
           VENUE
        ========================================= */

        .venue-section {
            width: 100%;

            text-align: center;

            padding: 60px 20px 50px;

            position: relative;

            z-index: 1;
        }

        .venue-label {
            font-family: "Montserrat", sans-serif;

            font-size: 12px;
            font-weight: 500;
            letter-spacing: 3px;

            color: #a48e83;

            margin-bottom: 14px;
        }

        .venue-heading {
            font-family: "Alex Brush", cursive;

            font-size: 52px;
            font-weight: 400;

            color: #c69973;

            margin-bottom: 18px;

            line-height: 1.1;
        }

        .venue-divider {
            width: 60px;
            height: 1px;

            background: #c69973;

            margin: 0 auto 22px;
        }

        .venue-name {
            font-family: "Alex Brush", cursive;

            font-size: 34px;

            color: #2c2a28;

            line-height: 1.4;

            margin-bottom: 4px;
        }

        .venue-address {
            font-family: "Alex Brush", cursive;

            font-size: 30px;

            color: #554a43;

            line-height: 1.5;

            max-width: 460px;

            margin: 0 auto;
        }


        /* =========================================
           RSVP
        ========================================= */

        .rsvp-section {
            width: 100%;

            min-height: 400px;

            display: flex;

            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 70px 20px
                calc(70px + env(safe-area-inset-bottom, 0px));

            position: relative;

            overflow: visible;
        }

        .rsvp-content {
            width: 100%;

            max-width: 500px;
        }

        .rsvp-heading {
            width: min(90%, 420px);

            height: auto;

            display: block;

            margin: 0 auto 30px;
        }

        .rsvp-buttons {
            display: flex;

            justify-content: center;

            gap: 20px;

            flex-wrap: wrap;
        }

        .rsvp-button {
            min-width: 145px;

            padding:
                14px
                18px;

            border: none;

            border-radius: 3px;

            cursor: pointer;

            color: white;

            font-family:
                "Montserrat",
                sans-serif;

            font-size: 9px;

            letter-spacing: 1.5px;

            transition:
                transform
                0.3s
                ease;
        }

        .rsvp-button:hover {
            transform:
                translateY(-3px);
        }

        .yes-button {
            background: #8d9189;
        }

        .no-button {
            background: #a48e83;
        }


        /* =========================================
           OUR STORY OVERLAY
        ========================================= */

        .story-overlay {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100vh;
            height: 100dvh;

            z-index: 9999;

            background-image:
                url("./background2.jpg");

            background-size: cover;

            background-position:
                center center;

            background-repeat: no-repeat;

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            transition:
                opacity
                0.5s
                ease;

            overflow: hidden;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 18px;

            padding:
                calc(60px + env(safe-area-inset-top, 0px))
                calc(12px + env(safe-area-inset-right, 0px))
                calc(24px + env(safe-area-inset-bottom, 0px))
                calc(12px + env(safe-area-inset-left, 0px));
        }

        .story-overlay.active {
            opacity: 1;

            visibility: visible;

            pointer-events: auto;
        }


        /* =========================================
           CLOSE BUTTON
        ========================================= */

        .story-close {
            position: absolute;

            top:
                calc(20px + env(safe-area-inset-top, 0px));
            right:
                calc(20px + env(safe-area-inset-right, 0px));

            width: 42px;
            height: 42px;

            border: none;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.75);

            color: #5b5149;

            font-size: 24px;

            cursor: pointer;

            z-index: 100;

            display: flex;

            align-items: center;
            justify-content: center;
        }


        /* =========================================
           STORY SLIDER
        ========================================= */

        .story-slider-area {
            position: relative;

            width: min(90vw, 720px);

            height: min(56vh, 470px);

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: visible;

            flex: 0 1 auto;

            touch-action: pan-y;

            margin-top: 40px;
        }

        .story-card {
            position: absolute;

            width: min(56vw, 340px);

            height: 100%;

            padding: 0;

            background: transparent;

            border: none;

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 12px 30px
                rgba(67, 51, 35, 0.25);

            transition:
                transform
                0.6s
                cubic-bezier(.22,.61,.36,1),

                opacity
                0.6s
                ease;

            opacity: 0;
        }

        .story-card.active {
            z-index: 10;

            transform:
                translateX(0)
                scale(1);

            opacity: 1;
        }

        .story-card.prev {
            z-index: 3;

            transform:
                translateX(-52%)
                rotate(-4deg)
                scale(0.9);

            opacity: 0.9;
        }

        .story-card.next {
            z-index: 3;

            transform:
                translateX(52%)
                rotate(4deg)
                scale(0.9);

            opacity: 0.9;
        }

        .story-card.hidden-left {
            z-index: 1;

            transform:
                translateX(-140%)
                scale(0.8);

            opacity: 0;
        }

        .story-card.hidden-right {
            z-index: 1;

            transform:
                translateX(140%)
                scale(0.8);

            opacity: 0;
        }

        .story-year {
            position: absolute;

            top: 14px;

            left: 50%;

            transform:
                translateX(-50%);

            font-family:
                "Montserrat",
                sans-serif;

            font-size: 13px;

            font-weight: 500;

            letter-spacing: 3px;

            color: #fff;

            padding: 5px 14px;

            background:
                rgba(0, 0, 0, 0.28);

            border-radius: 20px;

            z-index: 5;
        }

        .story-image {
            width: 100%;
            height: 100%;

            object-fit: cover;

            object-position: center;

            display: block;
        }

        .story-navigation {
            position: relative;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 45px;

            z-index: 50;

            flex: 0 0 auto;
        }

        .story-nav-btn {
            border: none;

            background: transparent;

            color: #554a43;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 62px;

            cursor: pointer;

            padding: 0 8px;
        }


        /* =========================================
           TABLET / SMALL DESKTOP
        ========================================= */

        @media (min-width: 651px) and (max-width: 1024px) {

            .second-page {
                max-width: 640px;

                box-shadow:
                    0 0 60px
                    rgba(0, 0, 0, 0.08);
            }

        }


        /* =========================================
           LARGE DESKTOP
        ========================================= */

        @media (min-width: 1025px) {

            body {
                background: #e7e0d6;
            }

            .second-page {
                max-width: 560px;

                box-shadow:
                    0 0 70px
                    rgba(0, 0, 0, 0.12);
            }

            .story-overlay {
                background-color: rgba(20, 16, 12, 0.35);

                background-blend-mode: darken;
            }

            .story-slider-area {
                width: min(70vw, 900px);

                height: min(68vh, 560px);

                margin-top: 20px;
            }

            .story-card {
                width: min(28vw, 420px);

                border-radius: 24px;
            }

            .story-navigation {
                gap: 60px;

                margin-top: 10px;
            }

            .story-nav-btn {
                font-size: 72px;
            }

            .story-close {
                width: 50px;
                height: 50px;

                font-size: 26px;
            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 650px) {

            :root {
                --note-overlap: -20px;
                --story-overlap: -40px;
            }

            .floral-deco {
                width: 70px;
            }

            .floral-deco.deco-bl {
                width: 62px;
            }

            .floral-deco.deco-br {
                width: 66px;
            }

            .leaf-deco {
                width: 100px;

                bottom: -6px;
                left: -6px;
            }

            .second-page {
                background-size: cover, cover;

                background-position:
                    center top,
                    center top;

                background-repeat:
                    no-repeat,
                    no-repeat;
            }

            .envelope-section {
                padding:
                    26px
                    10px
                    0;
            }

            .note-section {
                padding:
                    0
                    10px
                    20px;
            }

            .story-card-section {
                padding:
                    0
                    10px
                    40px;
            }

            .story-card-wrapper {
                margin-top: 30px;
            }

            .vinyl {
                width: 35%;

                top: -12%;
            }

            .countdown-heading {
                width:
                    min(92%, 340px);

                margin-bottom: 22px;
            }

            .countdown {
                gap: 6px;
            }

            .time-box {
                min-width: 72px;
            }

            .time-number {
                font-size: 42px;
            }

            .time-label {
                font-size: 11px;

                letter-spacing: 1.2px;
            }

            .separator {
                font-size: 38px;
            }

            .wedding-section {
                height: 310px;
            }

            .venue-section {
                padding: 45px 15px 35px;
            }

            .venue-heading {
                font-size: 40px;
            }

            .venue-name {
                font-size: 28px;
            }

            .venue-address {
                font-size: 24px;
            }

            .rsvp-section {
                min-height: 350px;

                padding:
                    60px
                    15px
                    calc(60px + env(safe-area-inset-bottom, 0px));
            }

            .rsvp-buttons {
                gap: 10px;
            }

            .rsvp-button {
                min-width: 0;

                flex: 1 1 0;

                padding: 12px 8px;

                font-size: 8px;

                letter-spacing: 1px;
            }

            .story-overlay {
                padding-top:
                    calc(100px + env(safe-area-inset-top, 0px));

                overflow-y: auto;
            }

            .story-slider-area {
                width: 100%;

                height: min(46vh, 380px);

                margin-top: 20px;
            }

            .story-card {
                width: min(60vw, 300px);

                border-radius: 18px;
            }

            .story-navigation {
                gap: 35px;
            }

            .story-nav-btn {
                font-size: 55px;
            }

        }


        @media (max-width: 420px) {

            .story-card {
                width: min(64vw, 280px);
            }

        }


        /* =========================================
           SMALL PHONES (down to 320px)
        ========================================= */

        @media (max-width: 380px) {

            .story-card-wrapper {
                width: min(85%, 400px);
            }

            .post-card {
                transform: rotate(-3deg);
            }

            .post-card:hover {
                transform:

        /* =========================================

<body>


    <!-- =========================================
         FIRST OPENING PAGE (VIDEO)
    ========================================= -->

    <div
        class="opening-page"
        id="openingPage"
        role="button"
        tabindex="0"
        aria-label="Tap to open invitation"
    >

        <!-- "#t=0.001" makes phones show the video's first frame
             (not a blank screen) before it is tapped. -->
        <video
            class="opening-page-video"
            id="openingVideo"
            src="./video-mobile.mp4#t=0.001"
            playsinline
            webkit-playsinline="true"
            muted
            preload="auto"
        ></video>

        <div class="tap-to-open" aria-hidden="true">
            <span class="tap-hand">👆</span>
            <span class="tap-label">Tap to Open</span>
        </div>

    </div>


    <div class="site" id="siteContent">

        <main class="second-page">


            <!-- ENVELOPE -->

            <section class="envelope-section">

                <div class="envelope-wrapper">

            <!-- POST CARD -->

            <section class="story-card-section">

                <div class="story-card-wrapper">

                    <img

                    >

                    <img

                        id="vinylPlayer"

                        alt="Play Music"
                        onclick="toggleStoryAudio()"
                    >

                    <audio
                        id="storyAudio"
                        src="https://cdn.shopify.com/s/files/1/0778/9474/6301/files/videoplayback_copy_2.mp3?v=1789390334"
                        preload="auto"

                    ></audio>

            </section>


            <!-- COUNTDOWN -->

            <section class="countdown-section">

                <img
                    class="countdown-heading"

                >

                <div class="countdown">

                    <div class="time-box">

                            class="time-number"
                            id="days"
                        >
                            00
                        </div>

                        <div class="time-label">
                            DAYS
                        </div>

                    </div>

                    <div class="separator">:</div>


                    <div class="time-box">

                        <div
                            class="time-number"
                            id="hours"
                        >
                            00
                        </div>

                        <div class="time-label">

                        </div>

                    </div>

                    <div class="separator">:</div>


                    <div class="time-box">

                        <div
                            class="time-number"
                            id="minutes"
                        >

                        </div>

                    <div class="separator">:</div>


                    <div class="time-box">

                        >

            <!-- WEDDING IMAGE -->

        <!-- OUR STORY OVERLAY -->

        <div
            class="story-overlay"

        >

            <button
                class="story-close"
                onclick="closeStory()"
                aria-label="Close"
            >
                ×
            </button>


            <div
                class="story-slider-area"
                id="storySlider"
            >



                <div class="story-card">
                    <img
                        class="story-image"
                        src="./13.jpeg"
                        alt="Our Story 2020"
                    >
                </div>

               <div class="story-card">
                    <img
                        class="story-image"
                        src="./12.png"
                        alt="Our Story 2020"
                    >
                </div>
             
<div class="story-card">
                    <img
                        class="story-image"
                        src="./16.png"
                        alt="Our Story 2023"
                    >
                </div>

                <div class="story-card">
                    <img
                        class="story-image"
                        src="./17.png"
                        alt="Our Story 2023"
                    >
                </div>
                <div class="story-card">
                    <img
                        class="story-image"
                        src="./15.png"
                        alt="Our Story 2023"
                    >
                </div>

                     <div class="story-card">
                    <img
                        class="story-image"
                        src="./prewedding_01_full_portrait.png"
                        alt="Our Story 2023"
                    >
                </div>
                
                 <div class="story-card">
                    <img
                        class="story-image"
                        src="./prewedding_05_romantic_closeup.png"
                        alt="Our Story 2023"
                    >
                </div>
                 <div class="story-card">
                    <img
                        class="story-image"
                        src="./prewedding_06_mountain_portrait.png"
                        alt="Our Story 2023"
                    >
                </div>
            </div>


            <div class="story-navigation">

                <button
                    class="story-nav-btn"
                    onclick="changeStory(-1)"
                    aria-label="Previous Story"
                >
                    &lt;
                </button>

                <button
                    class="story-nav-btn"
                    onclick="changeStory(1)"
                    aria-label="Next Story"
                >
                    &gt;
                </button>

            </div>

        </div>


    </div>


    <script>

        /* =========================================
           COUNTDOWN
        ========================================= */

        const weddingDate =
            new Date(
                "November 26, 2026 00:00:00"
            ).getTime();


        function updateCountdown() {

            const now =
                new Date().getTime();

            const distance =
                weddingDate - now;


            if (distance <= 0) {

                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";

                return;
            }


            const days =
                Math.floor(
                    distance /
                    (
                        1000 *
                        60 *
                        60 *
                        24
                    )
                );


            const hours =
                Math.floor(
                    (
                        distance %
                        (
                            1000 *
                            60 *
                            60 *
                            24
                        )
                    )
                    /
                    (
                        1000 *
                        60 *
                        60
                    )
                );


            const minutes =
                Math.floor(
                    (
                        distance %
                        (
                            1000 *
                            60 *
                            60
                        )
                    )
                    /
                    (
                        1000 *
                        60
                    )
                );


            const seconds =
                Math.floor(
                    (
                        distance %
                        (
                            1000 *
                            60
                        )
                    )
                    /
                    1000
                );


            document
                .getElementById("days")
                .innerText =
                String(days)
                .padStart(2, "0");


            document
                .getElementById("hours")
                .innerText =
                String(hours)
                .padStart(2, "0");


            document
                .getElementById("minutes")
                .innerText =
                String(minutes)
                .padStart(2, "0");


            document
                .getElementById("seconds")
                .innerText =
                String(seconds)
                .padStart(2, "0");

        }


        updateCountdown();

        setInterval(
            updateCountdown,
            1000
        );


        /* =========================================
           RSVP
        ========================================= */

        const rsvpWhatsAppNumber = "919910948594";


        function rsvpYes() {

            const message =
                "Hi! I'm excited to confirm — count us in for Hetvi & Manan's wedding! ❤️";

            window.open(
                "https://wa.me/" +
                rsvpWhatsAppNumber +
                "?text=" +
                encodeURIComponent(message),
                "_blank"
            );

        }


        function rsvpNo() {

            const message =
                "Hi! Sadly, I won't be able to make it to Hetvi & Manan's wedding. Sending my love and best wishes! ❤️";

            window.open(
                "https://wa.me/" +
                rsvpWhatsAppNumber +
                "?text=" +
                encodeURIComponent(message),
                "_blank"
            );

        }


        /* =========================================
           VINYL MUSIC
        ========================================= */

        const storyAudio =
            document.getElementById(
                "storyAudio"
            );

        const vinylPlayer =
            document.getElementById(
                "vinylPlayer"
            );


        function toggleStoryAudio() {

            if (storyAudio.paused) {

                storyAudio.play();

                vinylPlayer.classList.add(
                    "is-playing"
                );

            } else {

                storyAudio.pause();

                vinylPlayer.classList.remove(
                    "is-playing"
                );

            }

        }


        // Try to start music automatically once the invitation opens.
        // Browsers only allow audio with sound to autoplay if it is
        // triggered by a real user gesture. If the browser blocks it, the
        // guest's next touch anywhere on the page starts the music
        // (startMusicOnTouch).
        function autoStartMusic() {

            const playPromise = storyAudio.play();

            if (playPromise !== undefined) {

                playPromise
                    .then(function () {

                        vinylPlayer.classList.add(
                            "is-playing"
                        );

                    })
                    .catch(function () {

                        // Blocked by the browser - it will start on the
                        // guest's next touch (startMusicOnTouch).

                    });

            }

        }


        storyAudio.addEventListener(
            "ended",
            function () {

                vinylPlayer.classList.remove(
                    "is-playing"
                );

            }
        );


        /* =========================================
           OUR STORY SLIDER
        ========================================= */

        const storyOverlay =
            document.getElementById(
                "storyOverlay"
            );

        const storyCards =
            document.querySelectorAll(
                ".story-card"
            );

        let currentStory = 0;


        function openStory() {

            storyOverlay.classList.add(
                "active"
            );

            document.body.style.overflow =
                "hidden";

            updateStorySlider();

            // Pause the auto-scroll while browsing the story overlay,
            // it doesn't make sense to keep scrolling underneath it.
            stopAutoScroll();

        }


        function closeStory() {

            storyOverlay.classList.remove(
                "active"
            );

            document.body.style.overflow =
                "";

        }


        function changeStory(direction) {

            currentStory =
                (
                    currentStory +
                    direction +
                    storyCards.length
                )
                %
                storyCards.length;

            updateStorySlider();

        }


        function updateStorySlider() {

            const total =
                storyCards.length;


            const previous =
                (
                    currentStory -
                    1 +
                    total
                )
                %
                total;


            const next =
                (
                    currentStory +
                    1
                )
                %
                total;


            storyCards.forEach(
                function(card, index) {

                    card.classList.remove(
                        "active",
                        "prev",
                        "next",
                        "hidden-left",
                        "hidden-right"
                    );


                    if (index === currentStory) {

                        card.classList.add(
                            "active"
                        );

                    }

                    else if (index === previous) {

                        card.classList.add(
                            "prev"
                        );

                    }

                    else if (index === next) {

                        card.classList.add(
                            "next"
                        );

                    }

                    else {

                        const distance =
                            (
                                index -
                                currentStory +
                                total
                            )
                            %
                            total;


                        if (
                            distance >
                            total / 2
                        ) {

                            card.classList.add(
                                "hidden-left"
                            );

                        } else {

                            card.classList.add(
                                "hidden-right"
                            );

                        }

                    }

                }
            );

        }


        /* =========================================
           TOUCH SWIPE (mobile story slider)
        ========================================= */

        const storySliderArea =
            document.getElementById(
                "storySlider"
            );

        let touchStartX = 0;
        let touchStartY = 0;
        let touchActive = false;

        storySliderArea.addEventListener(
            "touchstart",
            function (event) {

                if (event.touches.length !== 1) {
                    return;
                }

                touchActive = true;
                touchStartX = event.touches[0].clientX;
                touchStartY = event.touches[0].clientY;

            },
            { passive: true }
        );

        storySliderArea.addEventListener(
            "touchend",
            function (event) {

                if (!touchActive) {
                    return;
                }

                touchActive = false;

                const touch = event.changedTouches[0];

                const deltaX = touch.clientX - touchStartX;
                const deltaY = touch.clientY - touchStartY;

                if (
                    Math.abs(deltaX) > 40 &&
                    Math.abs(deltaX) > Math.abs(deltaY) * 1.5
                ) {

                    if (deltaX < 0) {

                        changeStory(1);

                    } else {

                        changeStory(-1);

                    }

                }

            },
            { passive: true }
        );


        /* =========================================
           KEYBOARD NAVIGATION (story slider)
        ========================================= */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    !storyOverlay
                    .classList
                    .contains("active")
                ) {
                    return;
                }


                if (
                    event.key ===
                    "ArrowLeft"
                ) {

                    changeStory(-1);

                }


                if (
                    event.key ===
                    "ArrowRight"
                ) {

                    changeStory(1);

                }


                if (
                    event.key ===
                    "Escape"
                ) {

                    closeStory();

                }

            }
        );


        /* =========================================
           AUTO SCROLL (second page)
        ========================================= */

        let autoScrollActive = false;
        let autoScrollRAF = null;

        // How many pixels the page moves per animation frame.
        // Lower = slower / gentler scroll. Tweak to taste.
        const AUTO_SCROLL_SPEED = 0.55;


        function stopAutoScroll() {

            autoScrollActive = false;

            if (autoScrollRAF) {

                cancelAnimationFrame(
                    autoScrollRAF
                );

                autoScrollRAF = null;

            }

        }


        function startAutoScroll() {

            // Don't start it twice.
            if (autoScrollActive) {
                return;
            }

            autoScrollActive = true;


            function step() {

                if (!autoScrollActive) {
                    return;
                }

                const maxScroll =
                    document.documentElement.scrollHeight -
                    window.innerHeight;

                if (window.scrollY >= maxScroll - 2) {

                    stopAutoScroll();

                    return;

                }

                window.scrollBy(
                    0,
                    AUTO_SCROLL_SPEED
                );

                autoScrollRAF =
                    requestAnimationFrame(
                        step
                    );

            }

            autoScrollRAF =
                requestAnimationFrame(
                    step
                );

        }


        // The moment a guest scrolls, taps, drags or presses a key
        // themselves, hand control back to them and stop auto-scrolling.
        [
            "wheel",
            "touchstart",
            "mousedown",
            "keydown"
        ].forEach(
            function (evt) {

                window.addEventListener(
                    evt,
                    function () {

                        if (autoScrollActive) {

                            stopAutoScroll();

                        }

                    },
                    { passive: true }
                );

            }
        );


        /* =========================================
           FIRST PAGE: TAP -> VIDEO PLAYS -> VIDEO ENDS -> SITE OPENS
        ========================================= */

        const openingPage =
            document.getElementById(
                "openingPage"
            );

        const openingVideo =
            document.getElementById(
                "openingVideo"
            );

        const siteContent =
            document.getElementById(
                "siteContent"
            );

        let invitationOpened = false;
        let videoStarted = false;
        let videoWatchdog = null;


        openingVideo.load();


        // Safety net: if the video stalls or never finishes (slow
        // network, decoder problem), open the site anyway so the guest
        // is never stuck on the opening screen.
        function armVideoWatchdog(ms) {

            clearTimeout(videoWatchdog);

            videoWatchdog = setTimeout(
                openMainWebsite,
                ms
            );

        }

        openingVideo.addEventListener(
            "error",
            function () {

                if (videoStarted) {
                    openMainWebsite();
                }

            }
        );

        // Once real playback starts, allow the full length of the
        // video (plus a little slack) before the watchdog steps in.
        openingVideo.addEventListener(
            "playing",
            function () {

                const remaining =
                    isFinite(openingVideo.duration)
                        ? (openingVideo.duration - openingVideo.currentTime) * 1000
                        : 6000;

                armVideoWatchdog(remaining + 3000);

            }
        );

        // Buffering mid-video: give it a few seconds to recover.
        openingVideo.addEventListener(
            "waiting",
            function () {

                if (videoStarted) {
                    armVideoWatchdog(8000);
                }

            }
        );

        document.body.style.overflow = "hidden";


        function openMainWebsite() {

            if (invitationOpened) {
                return;
            }

            invitationOpened = true;

            clearTimeout(videoWatchdog);

            document.body.style.overflow = "";

            openingPage.classList.add(
                "hide"
            );

            siteContent.classList.add(
                "revealed"
            );

            // Start the music and begin gently auto-scrolling the
            // page once the invitation is revealed.
            autoStartMusic();

            setTimeout(
                startAutoScroll,
                900
            );

        }


        // The guest taps "Tap to Open" once. That single tap lets the
        // browser play sound, so the video plays WITH sound, and the
        // music then starts automatically when the second page opens.
        function playOpeningVideo() {

            if (videoStarted || invitationOpened) {
                return;
            }

            videoStarted = true;

            openingPage.classList.add("playing");

            // If the video hasn't started within 10s of the tap
            // (very slow connection), open the site anyway.
            armVideoWatchdog(10000);

            // Unlock the music during this tap (needed on iPhone) so it
            // can start by itself after the video, without another tap.
            storyAudio.muted = true;

            const unlockPromise = storyAudio.play();

            if (unlockPromise !== undefined) {

                unlockPromise
                    .then(function () {

                        if (!invitationOpened) {
                            storyAudio.pause();
                            storyAudio.currentTime = 0;
                        }

                        storyAudio.muted = false;

                    })
                    .catch(function () {

                        storyAudio.muted = false;

                    });

            }

            openingVideo.currentTime = 0;
            openingVideo.playbackRate = 1;
            openingVideo.muted = false;

            const playPromise = openingVideo.play();

            if (playPromise !== undefined) {

                playPromise.catch(function (error) {

                    // Rare: sound still blocked - play muted so the
                    // guest at least sees the video.
                    console.error(
                        "Opening video failed to play with sound, retrying muted:",
                        error
                    );

                    openingVideo.muted = true;

                    openingVideo.play().catch(function (retryError) {

                        console.error(
                            "Opening video failed to play, opening site instead:",
                            retryError
                        );

                        openMainWebsite();

                    });

                });

            }

        }


        // The video finishing naturally opens the site.
        openingVideo.addEventListener(
            "ended",
            openMainWebsite
        );


        openingPage.addEventListener(
            "click",
            playOpeningVideo
        );


        openingPage.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === "Enter" ||
                    event.key === " "
                ) {

                    event.preventDefault();

                    playOpeningVideo();

                }

            }
        );


        // Backup: if the browser still blocked the music, start it on
        // the guest's next touch anywhere on the second page.
        function startMusicOnTouch(event) {

            if (
                !invitationOpened ||
                vinylPlayer.contains(event.target)
            ) {
                return;
            }

            if (storyAudio.paused) {
                autoStartMusic();
            }

            ["touchend", "click", "keydown"].forEach(function (type) {
                document.removeEventListener(type, startMusicOnTouch, true);
            });

        }

        ["touchend", "click", "keydown"].forEach(function (type) {
            document.addEventListener(type, startMusicOnTouch, true);
        });

        updateStorySlider();

    </script>
